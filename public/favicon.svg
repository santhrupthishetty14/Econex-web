<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <g transform="translate(0, 35)">
    <!-- Left Loop: Leaf -->
    <path d="M 80 45 C 50 15, 15 15, 15 45 C 15 75, 50 75, 80 45 Z" fill="none" stroke="#1F6F50" stroke-width="11" stroke-linecap="round" />
    <path d="M 15 45 C 35 40, 60 45, 80 45" stroke="#2FAF90" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Right Loop: Gear -->
    <path d="M 80 45 C 110 15, 145 15, 145 45 C 145 75, 110 75, 80 45 Z" fill="none" stroke="#243238" stroke-width="11" stroke-linecap="round" />
    
    <!-- Gear teeth -->
    <g transform="translate(112.5, 45)">
      <rect x="-5.5" y="-39.5" width="11" height="11" rx="2" fill="#243238" transform="rotate(-90)" />
      <rect x="-5.5" y="-39.5" width="11" height="11" rx="2" fill="#243238" transform="rotate(-60)" />
      <rect x="-5.5" y="-39.5" width="11" height="11" rx="2" fill="#243238" transform="rotate(-30)" />
      <rect x="-5.5" y="-39.5" width="11" height="11" rx="2" fill="#243238" transform="rotate(0)" />
      <rect x="-5.5" y="-39.5" width="11" height="11" rx="2" fill="#243238" transform="rotate(30)" />
    </g>
  </g>
</svg>
